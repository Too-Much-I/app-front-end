name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 기본 job은 코드를 읽기만 한다. architecture job만 PR 결과 댓글에 필요한 권한을 좁게 덮어쓴다.
permissions:
  contents: read

jobs:
  verify:
    # 이 이름이 GitHub에 뜨는 체크 이름이고, main 룰셋의 required status check로 지정하는 값이다.
    # 검사를 추가할 때마다 바뀌지 않도록 무엇을 도는지는 이름에 넣지 않는다 — 아래 step이 보여준다.
    name: verify
    runs-on: ubuntu-latest
    steps:
      # push를 하지 않으므로 토큰을 .git/config에 남기지 않는다.
      # 뒤이어 도는 pnpm install이 의존성 스크립트를 실행하는 지점이다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # package.json의 packageManager 필드에서 pnpm 버전을 읽는다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      # lint가 실패해도 실행해, 한 번의 CI로 세 결과를 모두 본다.
      - name: pnpm typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # 파일 하나만 봐서는 판단할 수 없는 네이밍 규칙(같은 이름을 두 파일이 내보내는지 등)을
      # 검사한다. 규칙과 근거는 docs/architecture/01-naming-dictionary.md 에 있다.
      - name: pnpm check:naming
        if: ${{ !cancelled() }}
        run: pnpm check:naming

  architecture:
    # 최초 실행 뒤 main 룰셋의 required status check에 이 이름을 등록한다.
    name: architecture-boundaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 같은 저장소의 PR에서는 결과 댓글을 갱신한다. fork PR은 GitHub가 읽기 권한으로 낮추며,
      # 댓글이 실패해도 Job Summary는 남고 차단 검사 결과에는 영향을 주지 않는다.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # PR에서 추가·제거된 의존성만 경고하기 위한 비교 기준이다.
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: architecture-base
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm check:architecture (PR diff)
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm check:architecture -- --base-dir architecture-base --report-file architecture-report.md

      - name: pnpm check:architecture
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm check:architecture -- --report-file architecture-report.md

      # 새 댓글을 쌓지 않고 이 workflow가 만든 댓글 하나를 현재 결과로 갱신한다.
      - name: Update architecture report comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- architecture-boundaries-report -->";
            const body = fs.readFileSync("architecture-report.md", "utf8");
            const issue = context.issue;
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...issue,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
