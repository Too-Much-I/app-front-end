name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # package.json의 packageManager 필드에서 pnpm 버전을 읽는다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      # lint가 실패해도 실행해, 한 번의 CI로 두 결과를 모두 본다.
      - name: pnpm typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
